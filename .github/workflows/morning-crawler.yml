name: スマイルゼミ 朝通知(両コース・前日分)

on:
  # 毎日 UTC 17:47 (JST 2:47) に起動し、run-in-docker.yml 内で JST 7:00 まで待機してから実行する。
  # 前日分を取得するため、多少遅れても通知内容は正しい。
  schedule:
    - cron: '47 17 * * *'

  workflow_dispatch:

jobs:
  morning-notify:
    uses: ./.github/workflows/run-in-docker.yml
    with:
      command: docker compose run --rm crawler node src/morning-index.js
      target-time: '07:00'
      wait: ${{ github.event_name == 'schedule' }}
      # JST 7:00 までの最大待機 約253分 + ビルド/実行時間の余裕
      timeout-minutes: 300
      screenshot-artifact: morning-screenshots
    secrets: inherit
