name: スマイルゼミ 週間レポート通知

on:
  # 毎週月曜 UTC 08:00 (JST 17:00) に自動実行
  schedule:
    - cron: '0 8 * * 1'

  # 手動実行をサポート
  workflow_dispatch:

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write # scheduled workflowのkeepalive(enable API)に必要

    steps:
      # 1. リポジトリのチェックアウト
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      # 2. .envファイルを作成
      - name: .envファイルを作成
        run: |
          echo "SMILEZEMI_USERNAME=${{ secrets.SMILEZEMI_USERNAME }}" >> .env
          echo "SMILEZEMI_PASSWORD=${{ secrets.SMILEZEMI_PASSWORD }}" >> .env
          echo "LINE_CHANNEL_ACCESS_TOKEN=${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}" >> .env
          echo "LINE_USER_ID=${{ secrets.LINE_USER_ID }}" >> .env

      # 3. 環境変数の検証
      - name: 環境変数を検証
        run: |
          echo "環境変数の検証中..."
          if [ -z "${{ secrets.SMILEZEMI_USERNAME }}" ]; then
            echo "❌ SMILEZEMI_USERNAME が設定されていません"
            exit 1
          fi
          if [ -z "${{ secrets.SMILEZEMI_PASSWORD }}" ]; then
            echo "❌ SMILEZEMI_PASSWORD が設定されていません"
            exit 1
          fi
          if [ -z "${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}" ]; then
            echo "❌ LINE_CHANNEL_ACCESS_TOKEN が設定されていません"
            exit 1
          fi
          if [ -z "${{ secrets.LINE_USER_ID }}" ]; then
            echo "❌ LINE_USER_ID が設定されていません"
            exit 1
          fi
          echo "✅ 全ての環境変数が設定されています"

      # 4. Dockerイメージをビルド
      - name: Dockerイメージをビルド
        run: docker compose build

      # 5. 週間レポート通知を実行
      - name: 週間レポート通知を実行
        run: docker compose run --rm crawler node src/weekly-report-index.js

      # 6. スクリーンショットをアーティファクトとして保存（常に実行）
      - name: スクリーンショットを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report-screenshots-${{ github.run_number }}
          path: screenshots/
          retention-days: 90
          if-no-files-found: ignore

      # 7. .envファイルを削除（セキュリティ対策）
      - name: .envファイルを削除
        if: always()
        run: rm -f .env

      # 8. scheduled workflowのkeepalive
      # publicリポジトリは60日間コミット等の活動がないとscheduled workflowが
      # 自動無効化され、通知がサイレント停止する(連鎖して7日でキャッシュも消える)。
      # 週次でenable APIを叩いて無効化タイマーをリセットする。
      - name: scheduled workflowのkeepalive
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in crawler.yml morning-crawler.yml weekly-report.yml monthly-bonus.yml; do
            if gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${wf}/enable" >/dev/null; then
              echo "✅ ${wf} の無効化タイマーをリセットしました"
            else
              echo "::warning::${wf} のkeepaliveに失敗しました"
            fi
          done

      # 9. ワークフロー失敗をLINEに通知（最後の砦。この通知自体の失敗はジョブを落とさない）
      - name: 失敗をLINEに通知
        if: failure()
        env:
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LINE_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER: ${{ secrets.LINE_USER_ID }}
        run: |
          message=$(printf '⚠️ GitHub Actions ワークフローが失敗しました\n\nワークフロー: %s\n実行ログ: %s' "$WORKFLOW_NAME" "$RUN_URL")
          payload=$(jq -n --arg to "$LINE_USER" --arg text "$message" '{to: $to, messages: [{type: "text", text: $text}]}')
          curl -sS --fail-with-body -X POST https://api.line.me/v2/bot/message/push \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $LINE_TOKEN" \
            -d "$payload" || echo "::warning::失敗通知の送信に失敗しました"
