name: スマイルゼミ 月次ボーナス清算

on:
  # 「毎月1日 JST 8:00」はUTCでは前月末日23:00のため、cronで「1日」を直接指定できない。
  # 月末候補日(28〜31日)の UTC 22:47 (= JST翌日 7:47) に起動し、
  # JSTの日付が「1日」の場合のみ実行する(それ以外は数秒で正常終了)。
  schedule:
    - cron: '47 22 28-31 * *'

  # 手動実行をサポート(日付ガードをスキップして常に実行)
  workflow_dispatch:

jobs:
  date-guard:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.guard.outputs.run }}
    steps:
      - name: JST日付ガード
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "手動実行のため日付ガードをスキップします"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          today=$(TZ=Asia/Tokyo date +%d)
          if [ "$today" = "01" ]; then
            echo "JSTで1日のため実行します"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "JSTで1日ではないため何もせず終了します (JST day: ${today})"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  monthly-bonus:
    needs: date-guard
    if: needs.date-guard.outputs.run == 'true'
    uses: ./.github/workflows/run-in-docker.yml
    with:
      command: docker compose run --rm crawler node src/monthly-bonus-index.js
      target-time: '08:00'
      wait: ${{ github.event_name == 'schedule' }}
      # JST 8:00 までの最大待機 約13分 + ビルド/実行時間の余裕
      timeout-minutes: 30
    secrets: inherit
