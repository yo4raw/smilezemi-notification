name: スマイルゼミ 月次ボーナス清算

on:
  # 「毎月1日 JST 8:00」はUTCでは前月末日23:00のため、cronで「1日」を直接指定できない。
  # 月末候補日(28〜31日)の UTC 22:47 (= JST翌日 7:47) に起動し、
  # JSTの日付が「1日」の場合のみ実行する(それ以外は数秒で正常終了)。
  schedule:
    - cron: '47 22 28-31 * *'

  # 手動実行をサポート(日付ガードをスキップして常に実行)
  workflow_dispatch:

jobs:
  monthly-bonus:
    runs-on: ubuntu-latest
    # JST 8:00 までの最大待機 約13分 + ビルド/実行時間の余裕
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      # 1. リポジトリのチェックアウト
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v7

      # 2. JSTで「1日」かどうかを判定(月末でない候補日の空振りを排除)
      - name: JST日付ガード
        id: date-guard
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "手動実行のため日付ガードをスキップします"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          today=$(TZ=Asia/Tokyo date +%d)
          if [ "$today" = "01" ]; then
            echo "JSTで1日のため実行します"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "JSTで1日ではないため何もせず終了します (JST day: ${today})"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      # 3. .envファイルを作成
      - name: .envファイルを作成
        if: steps.date-guard.outputs.run == 'true'
        run: |
          echo "SMILEZEMI_USERNAME=${{ secrets.SMILEZEMI_USERNAME }}" >> .env
          echo "SMILEZEMI_PASSWORD=${{ secrets.SMILEZEMI_PASSWORD }}" >> .env
          echo "LINE_CHANNEL_ACCESS_TOKEN=${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}" >> .env
          echo "LINE_USER_ID=${{ secrets.LINE_USER_ID }}" >> .env
          echo "DISCORD_WEBHOOK_URL=${{ secrets.DISCORD_WEBHOOK_URL }}" >> .env
          echo "TURSO_DATABASE_URL=${{ secrets.TURSO_DATABASE_URL }}" >> .env
          echo "TURSO_AUTH_TOKEN=${{ secrets.TURSO_AUTH_TOKEN }}" >> .env

      # 3.5 環境変数の検証(docker buildとJST 8:00までの待機より前に落とすため)
      - name: 環境変数を検証
        if: steps.date-guard.outputs.run == 'true'
        run: |
          echo "環境変数の検証中..."
          if [ -z "${{ secrets.SMILEZEMI_USERNAME }}" ]; then
            echo "❌ SMILEZEMI_USERNAME が設定されていません"
            exit 1
          fi
          if [ -z "${{ secrets.SMILEZEMI_PASSWORD }}" ]; then
            echo "❌ SMILEZEMI_PASSWORD が設定されていません"
            exit 1
          fi
          if [ -z "${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}" ]; then
            echo "❌ LINE_CHANNEL_ACCESS_TOKEN が設定されていません"
            exit 1
          fi
          if [ -z "${{ secrets.LINE_USER_ID }}" ]; then
            echo "❌ LINE_USER_ID が設定されていません"
            exit 1
          fi
          if [ -z "${{ secrets.TURSO_DATABASE_URL }}" ]; then
            echo "❌ TURSO_DATABASE_URL が設定されていません"
            exit 1
          fi
          if [ -z "${{ secrets.TURSO_AUTH_TOKEN }}" ]; then
            echo "❌ TURSO_AUTH_TOKEN が設定されていません"
            exit 1
          fi
          echo "✅ 全ての環境変数が設定されています"

      # 4. Dockerイメージをビルド
      - name: Dockerイメージをビルド
        if: steps.date-guard.outputs.run == 'true'
        run: docker compose build

      # 5. JST 8:00 まで待機(スケジュール実行時のみ。遅延起動時は即実行)
      - name: JST 8:00まで待機
        if: steps.date-guard.outputs.run == 'true' && github.event_name == 'schedule'
        run: |
          target=$(TZ=Asia/Tokyo date -d "today 08:00" +%s)
          now=$(date +%s)
          wait_sec=$(( target - now ))
          if [ "$wait_sec" -gt 0 ]; then
            echo "JST 8:00まで ${wait_sec} 秒待機します"
            sleep "$wait_sec"
          else
            echo "既にJST 8:00を過ぎているため即実行します"
          fi

      # 6. 月次ボーナス清算を実行
      - name: 月次ボーナス清算を実行
        if: steps.date-guard.outputs.run == 'true'
        run: docker compose run --rm crawler node src/monthly-bonus-index.js

      # 7. .envファイルを削除(セキュリティ対策)
      - name: .envファイルを削除
        if: always()
        run: rm -f .env

      # 10. ワークフロー失敗を通知(最後の砦。LINE→失敗時のみDiscord。この通知自体の失敗はジョブを落とさない)
      - name: 失敗を通知（LINE→失敗時のみDiscord）
        if: failure()
        env:
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LINE_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER: ${{ secrets.LINE_USER_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          message=$(printf '⚠️ GitHub Actions ワークフローが失敗しました\n\nワークフロー: %s\n実行ログ: %s' "$WORKFLOW_NAME" "$RUN_URL")
          payload=$(jq -n --arg to "$LINE_USER" --arg text "$message" '{to: $to, messages: [{type: "text", text: $text}]}')

          if curl -sS --fail-with-body -X POST https://api.line.me/v2/bot/message/push \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $LINE_TOKEN" \
            -d "$payload"; then
            exit 0
          fi

          echo "::warning::LINEへの失敗通知に失敗しました"

          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::warning::DISCORD_WEBHOOK_URL が未設定のためDiscordへの転送をスキップします"
            exit 0
          fi

          discord_message=$(printf '⚠️ LINEへの送信に失敗したためDiscordに転送しました\n\n%s' "$message")
          discord_payload=$(jq -n --arg content "$discord_message" '{content: $content}')
          curl -sS --fail-with-body -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$discord_payload" || echo "::warning::Discordへの失敗通知の送信にも失敗しました"
