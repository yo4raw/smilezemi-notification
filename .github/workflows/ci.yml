name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: 依存パッケージをインストール
        run: npm ci

      - name: Lintを実行
        run: npm run lint

      - name: テストを実行
        run: npm test

  # 本番ワークフローはDockerイメージ経由で実行されるため、
  # ビルドが壊れているとテストが通っていても本番が落ちる。ビルド成否をCIで検証する。
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Dockerイメージをビルド
        run: docker build -t smilezemi-notification-ci .
