name: ストリークデータ表示

# 手動変更の前に、正確なユーザーキーと現在値を確認するための読み取り専用ワークフロー。
# キャッシュを復元して現在の streak / grace / bonus を表示するだけで、データは書き換えない。

on:
  workflow_dispatch:

jobs:
  show:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # キャッシュ整合性チェック(gh api)に必要

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: 前回データを復元
        id: restore-data
        uses: actions/cache/restore@v6
        with:
          path: data
          key: smilezemi-data-${{ github.run_id }}
          restore-keys: |
            smilezemi-data-

      # 既存エントリがあるのに復元できなかった場合はキャッシュ異常の可能性。
      # 空データを「最新」として誤認しないよう中断する(表示専用だが挙動を統一)
      - name: キャッシュ復元の整合性を検証
        if: steps.restore-data.outputs.cache-matched-key == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/caches?key=smilezemi-data-" --jq '.total_count')
          if [ "$count" -gt 0 ]; then
            echo "::error::既存のキャッシュエントリ(${count}件)があるのに復元できませんでした。キャッシュサービス回復後に再実行してください。"
            exit 1
          fi
          echo "キャッシュエントリなし(初回実行またはエビクション後)"

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 現在値を表示
        run: node scripts/show-streak-data.js
