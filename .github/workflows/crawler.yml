name: スマイルゼミ クローラー
# 両コース(小学生・中学生)の当日速報を夜間に通知。ストリークは確定・保存しない。

on:
  # 毎日 UTC 06:17 (JST 15:17) に起動し、run-in-docker.yml 内で JST 20:00 まで待機してから実行する。
  # 毎時0分は混雑のため遅延が最大化しやすく、意図的に避けている。
  schedule:
    - cron: '17 6 * * *'

  workflow_dispatch:

jobs:
  crawl:
    uses: ./.github/workflows/run-in-docker.yml
    with:
      # --exit-code-from でコンテナのexit codeをジョブに伝搬する
      command: docker compose up --exit-code-from crawler
      target-time: '20:00'
      wait: ${{ github.event_name == 'schedule' }}
      # JST 20:00 までの最大待機 約283分 + ビルド/実行時間の余裕
      timeout-minutes: 320
      screenshot-artifact: screenshots
    secrets: inherit
