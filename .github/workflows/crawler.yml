name: スマイルゼミ クローラー

on:
  # 毎日 UTC 06:17 (JST 15:17) に起動し、ワークフロー内で JST 20:00 まで待機してから実行する。
  # GitHub Actions の schedule は数時間遅延することがあるため(実測 1〜5.5時間)、
  # 前倒しで起動して目標時刻まで sleep する方式を採用。
  # 毎時0分は混雑のため遅延が最大化しやすく、意図的に避けている。
  schedule:
    - cron: '17 6 * * *'

  # 手動実行をサポート
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    # JST 20:00 までの最大待機 約283分 + ビルド/実行時間の余裕
    timeout-minutes: 320

    steps:
      # 1. リポジトリのチェックアウト
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      # 前回データ(ミッション・ストリーク)をキャッシュから復元
      - name: 前回データを復元
        uses: actions/cache/restore@v4
        with:
          path: data
          key: smilezemi-data-${{ github.run_id }}
          restore-keys: |
            smilezemi-data-

      # 2. .envファイルを作成
      - name: .envファイルを作成
        run: |
          echo "SMILEZEMI_USERNAME=${{ secrets.SMILEZEMI_USERNAME }}" >> .env
          echo "SMILEZEMI_PASSWORD=${{ secrets.SMILEZEMI_PASSWORD }}" >> .env
          echo "LINE_CHANNEL_ACCESS_TOKEN=${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}" >> .env
          echo "LINE_USER_ID=${{ secrets.LINE_USER_ID }}" >> .env

      # 3. 環境変数の検証
      - name: 環境変数を検証
        run: |
          echo "環境変数の検証中..."
          if [ -z "${{ secrets.SMILEZEMI_USERNAME }}" ]; then
            echo "❌ SMILEZEMI_USERNAME が設定されていません"
            exit 1
          fi
          if [ -z "${{ secrets.SMILEZEMI_PASSWORD }}" ]; then
            echo "❌ SMILEZEMI_PASSWORD が設定されていません"
            exit 1
          fi
          if [ -z "${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}" ]; then
            echo "❌ LINE_CHANNEL_ACCESS_TOKEN が設定されていません"
            exit 1
          fi
          if [ -z "${{ secrets.LINE_USER_ID }}" ]; then
            echo "❌ LINE_USER_ID が設定されていません"
            exit 1
          fi
          echo "✅ 全ての環境変数が設定されています"

      # 4. Dockerイメージをビルド
      - name: Dockerイメージをビルド
        run: docker compose build

      # 5. JST 20:00 まで待機（スケジュール実行時のみ）
      #    cron 起動が遅延して既に 20:00 を過ぎている場合は即実行する
      - name: JST 20:00まで待機
        if: github.event_name == 'schedule'
        run: |
          target=$(TZ=Asia/Tokyo date -d "today 20:00" +%s)
          now=$(date +%s)
          wait_sec=$(( target - now ))
          if [ "$wait_sec" -gt 0 ]; then
            echo "JST 20:00まで ${wait_sec} 秒待機します"
            sleep "$wait_sec"
          else
            echo "既にJST 20:00を過ぎているため即実行します"
          fi

      # 6. クローラーを実行
      - name: クローラーを実行
        run: docker compose up --abort-on-container-exit

      # データをキャッシュに保存(次回実行時に復元される)
      # 通知失敗などで exit code 1 でも確定済みストリークは保持したいため always()
      - name: データをキャッシュに保存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: smilezemi-data-${{ github.run_id }}

      # 7. スクリーンショットをアーティファクトとして保存（常に実行）
      - name: スクリーンショットを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_number }}
          path: screenshots/
          retention-days: 90
          if-no-files-found: ignore

      # 8. ミッションデータをアーティファクトとして保存（成功時のみ）
      - name: ミッションデータを保存
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mission-data
          path: data/mission_data.json
          retention-days: 90
          if-no-files-found: ignore

      # 9. .envファイルを削除（セキュリティ対策）
      - name: .envファイルを削除
        if: always()
        run: rm -f .env
